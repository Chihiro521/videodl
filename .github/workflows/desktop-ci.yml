name: Desktop checks

on:
  push:
    branches: [desktop, 'codex/**']
  pull_request:
    branches: [desktop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Automation guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify synchronization boundaries
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/desktop' }}
        run: python scripts/desktop_automation.py guard --base "$BASE_REF"
      - name: Test automation against disposable Git histories
        run: python -m unittest discover -s scripts/tests -v

  test:
    name: Desktop tests
    needs: guard
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements.txt
      - run: python -m pip install -r desktop/requirements.txt pytest==9.1.1
      - name: Prepare pinned media tools
        shell: pwsh
        run: |
          $tools = python -c "from desktop.build import media_tools; print(media_tools()[0])"
          $tools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python -m pytest desktop/tests -q
