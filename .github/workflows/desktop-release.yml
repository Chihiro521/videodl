name: Desktop release

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（可留空；须与 desktop/__init__.py 一致）'
        type: string
        required: false
      create_draft:
        description: '测试通过后创建发行草稿；关闭则仅生成验证用附件'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and test portable exe
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      revision: ${{ steps.target.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements.lock
      - name: Validate reviewed release target
        id: target
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python scripts/desktop_automation.py release-target
      - run: python scripts/desktop_automation.py guard
      - run: python -m pip install -r desktop/requirements.lock pytest==9.1.1 pyinstaller==6.22.3
      - name: Prepare pinned media tools
        shell: pwsh
        run: |
          $tools = python -c "from desktop.build import media_tools; print(media_tools()[0])"
          $tools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python -m pytest desktop/tests -q
      - run: python -m desktop.build
      - name: Test frozen worker without external Python or FFmpeg
        shell: pwsh
        run: |
          $env:VIDEODL_TEST_EXE = Join-Path $pwd 'dist/desktop/VideoDL Desktop/VideoDL Desktop.exe'
          python -m pytest desktop/tests/test_worker.py -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VideoDL-Desktop-windows-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/desktop/*.zip
            dist/desktop/SHA256SUMS.txt
            dist/desktop/VideoDL Desktop/build-info.json

  draft:
    name: Create verified release draft
    needs: windows
    if: github.event_name == 'push' || inputs.create_draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.windows.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: VideoDL-Desktop-windows-x64
          path: release-artifact
      - name: Verify artifact and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_DIR: release-artifact
          RELEASE_TAG: ${{ needs.windows.outputs.tag }}
          RELEASE_REVISION: ${{ needs.windows.outputs.revision }}
        run: python scripts/desktop_release.py
